# ※※※※※※※※※※※※※※※ 锚点区域 ※※※※※※※※※※※※※※※
# 锚点
Anchor_AA: &Anchor_AA {type: select, include-all: true}
Anchor_BB: &Anchor_BB {type: url-test, url: 'https://www.g.cn/generate_204', interval: 600, lazy: true, tolerance: 50, timeout: 3000, max-failed-times: 3, hidden: false, include-all: true}
Anchor_CC: &Anchor_CC {type: url-test, url: 'https://gemini.google.com/app', interval: 600, lazy: true, tolerance: 50, timeout: 3000, max-failed-times: 3, hidden: false, include-all: true}
Anchor_FI: &Anchor_FI '^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$'
Anchor_AI: &Anchor_AI '^(?i)(?=.*(台湾|美国)).*$'
Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT}
## Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}
## type：可选http/file/inline  behavior：可选domain/ipcidr/classical format：可选yaml/text/mrs

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# ※※※※※※※※※※※※※※※ 节点订阅 ※※※※※※※※※※※※※※※
proxy-providers:
  Provider_1: {<<: *Anchor_PR, url: 'https://dah.n-=l.com/api/v1/q/697726db523', override: {additional-prefix: '[Provider_1] '}}
  Provider_2: {<<: *Anchor_PR, url: 'https://dah.n-=l.com/api/v1/q/697726db523', override: {additional-prefix: '[Provider_2] '}}




# ※※※※※※※※※※※※※※※ 核心配置 ※※※※※※※※※※※※※※※
# 基础配置
mixed-port: 7890                                                        # 监听端口  HTTP + SOCKS5 混合代理端口
mode: rule                                                              # 工作模式  rule（规则模式）/ global（全局模式）/ direct（直连模式）
allow-lan: true                                                         # 局域连接  是否允许局域网设备连接
bind-address: "*"
tcp-concurrent: true                                                    # 并发连接  提升多任务性能
unified-delay: true                                                     # 统一延迟  减少节点延迟抖动
log-level: error                                                        # 日志级别  silent（静默）/ error（错误）/ warning（警告）/ info（信息）/ debug（调试）
ipv6: false                                                              # 网络协议  是否启用 IPv6 支持
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true                                                  # 保存选择  记住上次选择的节点和策略组
ntp:
  enable: true
#  write-to-system: true                                                # 视系统时间是否更新而定


# ※※※※※※※※※※※※※※※ 嗅探 设置 ※※※※※※※※※※※※※※※
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"


# ※※※※※※※※※※※※※※※ DNS 设置 ※※※※※※※※※※※※※※※
dns:
  enable: true                                                          # 解析服务  启用 Clash 内置 DNS 服务
  cache-algorithm: arc                                                  
  ipv6: false                                                            # 网络协议  启用 IPv6 DNS 解析支持
  respect-rules: true                                                   # 遵循规则  不强制遵循规则顺序
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5          
    - 114.114.114.114
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - system
  nameserver:
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    
# ※※※※※※※※※※※※※※※ 代理策略组 ※※※※※※※※※※※※※※※
# 策略组（按服务分组）
proxy-groups:
  - {name: VPN(Export), type: select, proxies: [自动选择, 手动选择]}
  - {name: Gemini等模型, type: select, proxies: [自动选择, 手动选择, AI自动选择, AI手动选择]}
  - {name: AI自动选择,   <<: *Anchor_BB, filter: *Anchor_AI}
  - {name: AI手动选择,   <<: *Anchor_AA, filter: *Anchor_AI}
  - {name: 自动选择,   <<: *Anchor_BB}
  - {name: 手动选择,   <<: *Anchor_AA}
#   - {name: 自动选择,   <<: *Anchor_BB, filter: *Anchor_FI}
#   - {name: 手动选择,   <<: *Anchor_AA, filter: *Anchor_FI}

# ※※※※※※※※※※※※※※※ 服务分流 ※※※※※※※※※※※※※※※
rules:
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ai_domain,AI模型(Export)
  - RULE-SET,youtube_domain,VPN(Export)
  - RULE-SET,google_domain,AI模型(Export)
  - DOMAIN-KEYWORD,赔钱,VPN(Export)
  - DOMAIN-KEYWORD,pqjc,VPN(Export)
  - DOMAIN-KEYWORD,qichiyu,VPN(Export)
  - DOMAIN-KEYWORD,magnific,VPN(Export)
  - DOMAIN-KEYWORD,cloudflare,VPN(Export) 
  - IP-CIDR,1.1.1.1/32,VPN(Export),no-resolve
  - RULE-SET,github_domain,VPN(Export)
  - RULE-SET,tiktok_domain,VPN(Export) 
  - RULE-SET,twitter_domain,VPN(Export)
  - RULE-SET,telegram_domain,VPN(Export)
  - RULE-SET,okx_domain,VPN(Export)   
  - RULE-SET,paypal_domain,VPN(Export)
  - RULE-SET,binance_domain,VPN(Export)    
  - RULE-SET,usd_domain,VPN(Export)   
  - DOMAIN,public.easytier.top,DIRECT
  - DOMAIN,scholarcn_domain.google.com,AI模型(Export)
  - RULE-SET,netflix_domain,VPN(Export)
  - RULE-SET,scholarcn_domain,DIRECT
  - RULE-SET,gamescn_domain,DIRECT
  - RULE-SET,teamviewer_domain,DIRECT
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,steamcn_domain,DIRECT  
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,cn_domain,DIRECT  
  - RULE-SET,gfw_domain,VPN(Export)
  - RULE-SET,telegram_ip,VPN(Export) 
  - RULE-SET,netflix_ip,VPN(Export)
  - RULE-SET,cn_ip,DIRECT  
  - PROCESS-NAME,language_server_windows,VPN(Export)
  - PROCESS-NAME,language_server.exe,VPN(Export)
  - PROCESS-NAME,Antigravity.exe,VPN(Export)
  - PROCESS-NAME,node.exe,VPN(Export)
  - MATCH,VPN(Export)

